name: Build Android Health Connect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-health-connect/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-health-connect assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: saude-bhr-android
          path: android-health-connect/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
